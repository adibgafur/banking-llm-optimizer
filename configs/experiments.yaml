model:
  primary: "qwen/qwen3.8-27b"
  secondary: "openai/gpt-oss-20b"
  tertiary: "openai/gpt-oss-120b"

retrieval:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  dimension: 384
  index_path: "data/processed/faiss_train_pool.index"
  embeddings_path: "data/processed/train_pool_embeddings.npy"
  k_values:
    - 1
    - 3
    - 5
    - 8
    - 10
  diversity_candidate_pool: 20

evaluation:
  random_seed: 42
  validation_split_ratio: 0.10
  validation_samples: 500
  final_test_samples: 3080

confidence:
  default_threshold: 0.80
  thresholds: 
    - 0.60
    - 0.70
    - 0.80
    - 0.90

pricing:
  "qwen/qwen3.8-27b":
    input_per_million: 0.20
    output_per_million: 0.20
  "openai/gpt-oss-20b":
    input_per_million: 0.20
    output_per_million: 0.20
  "openai/gpt-oss-120b":
    input_per_million: 0.80
    output_per_million: 0.80
  default:
    input_per_million: 0.20
    output_per_million: 0.20

generation:
  temperature: 0.0
  max_tokens: 600

cache:
  enabled: true
  db_path: "cache/llm_cache.sqlite"
